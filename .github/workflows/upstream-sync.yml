
name: Check upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read our version
        id: ours
        shell: bash
        run: |
          OURS=$(grep -oP "^version\s+'\K[^']+" fxmanifest.lua)

          if [ -z "$OURS" ]; then
            echo "Could not read version from our fxmanifest.lua"
            exit 1
          fi

          echo "version=$OURS" >> "$GITHUB_OUTPUT"
          echo "Our version: $OURS"

      - name: Read upstream version and commits
        id: theirs
        shell: bash
        run: |
          git remote add upstream https://github.com/overextended/ox_inventory.git
          git fetch --quiet upstream main

          THEIRS=$(git show upstream/main:fxmanifest.lua | grep -oP "^version\s+'\K[^']+")

          if [ -z "$THEIRS" ]; then
            echo "Could not read version from upstream fxmanifest.lua"
            exit 1
          fi

          echo "version=$THEIRS" >> "$GITHUB_OUTPUT"

          # Find the upstream commit where this version was introduced.
          BUMP=$(git log upstream/main --format='%H' -S"$THEIRS" -- fxmanifest.lua | head -1)

          if [ -n "$BUMP" ]; then
            COMMITS=$(git log --no-merges -n 30 --format='- %h %s' "$BUMP..upstream/main")
          else
            echo "Could not identify version introduction commit; showing latest upstream commits."
            COMMITS=$(git log --no-merges -n 30 --format='- %h %s' upstream/main)
          fi

          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "Upstream version: $THEIRS"

      - name: Report upstream changes
        env:
          OURS: ${{ steps.ours.outputs.version }}
          THEIRS: ${{ steps.theirs.outputs.version }}
          COMMITS: ${{ steps.theirs.outputs.commits }}
        shell: bash
        run: |
          {
            echo "# Upstream ox_inventory check"
            echo ""
            echo "| Version | Value |"
            echo "|---|---|"
            echo "| Our fork | $OURS |"
            echo "| Upstream | $THEIRS |"
            echo ""

            if [ "$OURS" = "$THEIRS" ] && [ -z "$COMMITS" ]; then
              echo "## Up to date"
              echo "No upstream changes detected."
            else
              echo "## Upstream changes detected"
              echo ""
              echo "Review and manually port relevant changes into this fork."
              echo ""
              echo "### Recent upstream commits"
              echo ""
              echo "${COMMITS:-No commit details available.}"
              echo ""
              echo "### Upstream links"
              echo ""
              echo "- [Upstream repository](https://github.com/overextended/ox_inventory)"
              echo "- [Upstream commit history](https://github.com/overextended/ox_inventory/commits/main/)"
              echo "- [Version comparison](https://github.com/overextended/ox_inventory/compare/v${OURS}...main)"
              echo ""
              echo "> This workflow reports upstream changes only. It does not automatically merge or install upstream changes. Review security fixes and compatibility before porting them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$OURS" != "$THEIRS" ] || [ -n "$COMMITS" ]; then
            echo "::warning::Upstream changes detected. Review the Actions run summary."
          else
            echo "Up to date with upstream $THEIRS."
          fi
